abstract:
- language: en
  script: Latn
  content: |-
    The paper focuses on the Light Flickermeter, a standardised algorithm which is widely used to estimate the severity of flicker of artificial light sources for human observers. The development of the algorithm is briefly covered with special focus on clarification of many ambiguities about meaning of the results that the algorithm produces. Laboratory measurements performed with human observers are used as an empirical basis for the claims presented in the paper. Some of the limitations of the algorithm, being a necessary consequence of how the algorithm was developed, are exposed and discussed. A modified algorithm is presented which removes some of these limitations and thus allows for an easier interpretation of the results.
