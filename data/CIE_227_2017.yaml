abstract:
- language: en
  script: Latn
  content: |-
    CIE 227:2017 summarizes lighting recommendations on lighting and visual environment in interior spaces such as offices, public spaces, and residences for healthy older people (defined as people aged 50 years and older) with normal vision, and people with low vision, and implements guidelines described in CIE 196:2011 into practical solutions.

    The report provides (1) illuminance recommendations, derived from simulations with existing visual models for older people, (2) state of art of studies on how light helps people with low vision see objects by reviewing recent literature, and (3) design guidelines for lighting practitioners how to design appropriate visual environments for people with low vision.

    The publication is written in English, with a short summary in French and German.

    English version is included in the case of purchasing a translation.
