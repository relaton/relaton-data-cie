abstract:
- language: en
  script: Latn
  content: |-
    Low-position road lighting systems (hereafter referred to as Low-position lighting) are effective in preventing collapse of lighting poles, fall of lamps from lighting poles, and in making inspections easier. In Japan, 'Road Lighting Installation Standards, 2007' is applied to performance indicators for road lighting systems, however these assume to set up the pole-type road lighting systems (hereinafter referred to as High-position lighting systems). The Low-position lighting system has not yet been introduced in earnest. The present study compared the visibility of the Low-position lighting with conventional High-position lighting and confirmed that the Low-position lighting could achieve the same level of visibility performance as conventional High-position lighting. At last, we propose tentative performance indicators targeted on Low-position lighting and summarized specific issues for the Low-position lighting.
                  See more
