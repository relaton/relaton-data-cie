abstract:
- language: en
  script: Latn
  content: |-
    Light pollution is increasing at a rate between 6-10% each year worldwide, faster than population growth or GDP increase. This suggests that the growing market for decorative outdoor luminaires contributes to the problem. Stray light in outdoor LED luminaires is analysed using the FRED raytracing software. Fresnel reflections are shown to be a large contributor to upward light, especially from protective plastic covers. Additionally, up to 0.5% of the lamp flux may be scattered due to these covers. This study shows how this light escapes as ULOR, how to look for it in a luminaire design, and proposes decorative design forms that overcome this challenge. The “Full-Cutoff Fixture” design remains the most effective method for conforming to dark sky standards.
                  See more
