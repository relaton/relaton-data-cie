abstract:
- language: en
  script: Latn
  content: |-
    Confined Spaces is short of lighting and is difficult to perceive time changes, which is easy to lead to rhythm disorders and sleep disorders. It is urgent to introduce dynamic lighting mode. In this study, 20 male subjects were subjected to 4 consecutive weeks of closed experiments in an underground confined space, using 1 light mode per week (constant light mode and 2 dynamic light modes that induced the rhythm phase to move forward or backward). Melatonin and cortisol concentrations, core body temperature, and subjective sleepiness (Karolinska scale score) were collected daily at bedtime. The results showed that the bedtime melatonin concentration and subjective sleepiness score decreased day by day in week 1, and the change trend was opposite in week 2 and 4. At the 3rd week, the melatonin concentration and KSS score before bedtime were significantly decreased, and the core body temperature was significantly increased (p < 0.05). There was a cumulative effect of light on hormone concentration, core body temperature and subjective alertness. The dynamic light mode can effectively induce the shift of rhythm phase. The appropriate dynamic light mode can be customized according to the individual's "social jet lag."
