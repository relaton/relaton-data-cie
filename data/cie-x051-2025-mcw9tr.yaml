abstract:
- language: en
  script: Latn
  content: This paper introduces an extremely high-resolution wide-band array (EHRA)
    spectroradiometer that can achieve ultrahigh spectral resolution within a wide
    wavelength band and has the full-band blazed characteristics. It uses a grating
    and a prism for cross dispersion, and the obtained spectrograms are no longer
    simple one-dimensional images, posing new challenges for spectrogram reconstruction
    and wavelength calibration. A spectrogram-reconstruction algorithm and wavelength-calibration
    method is further proposed. A theoretical spectrogram model is firstly established
    based on the crossed-dispersion theories, and the model is then mapped onto an
    actual reference spectrogram by leveraging the abundant characteristic spectral
    lines in different orders of a Hg-Ar lamp, further using an intelligent spectrogram-recognition
    algorithm, a high-precision spectrogram reconstruction was achieved. Experimental
    results demonstrated that within the wavelength range from 380 nm – 1000 nm,
    its spectral resolution, spectral accuracy, and wavelength repeatability are better
    than 0.1 nm, 0.025 nm, and 0.005 nm respectively.
