abstract:
- language: en
  script: Latn
  content: |-
    In order to identify the relationship between the metrics indicating properties of light colour and subjective evaluation of colour appearance, field measurements and subjective experiments are carried out. It was shown that there are cases where general colour rendering index (Ra) is low and the Relative Gamut Area Index (Ga) is high. For RGBLED, duv and Ga were negatively correlated, however, it was suggested that even for the same CCT and duv, Ga varies with the type of light source. The subjects' evaluation showed that light sources with greater Ga were rated higher than light sources with greater Ra, for vividness and desirability. For naturalness, the light source with greater Ra was rated higher than light source with greater Ga for both the wood pieces and the flower painting, at 14000 K. No difference in evaluations was found between the visual objects, the wood piece and the flower painting.
