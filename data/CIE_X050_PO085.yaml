abstract:
- language: en
  script: Latn
  content: |-
    The lighting requirements for headlamps should be ideally defined, to ensure good vision and to avoid accidents in the dark: (1) Headlamps should have several different lighting modes for allowing to adapt the light output and the light distribution according to different visual tasks and operation purposes. (2) Vision within the entire visual field can be achieved with a “low gradient” effect from the light cone towards the dark surrounding. (3) Headlamps have to be flicker-free. (4) The risk of direct and indirect glare must be reduced.Therefore, when designing a headlamp, a compromise has to be found between the requirements for luminous flux, luminous intensity distribution and handling, whereas glare and disturbances of dark adaptation need to be avoided.We would like to suggest additional standardization on top of the existing ANSI standard. This should also be beneficial when using headlamps in brighter environments and for the use of pocket lamps.
