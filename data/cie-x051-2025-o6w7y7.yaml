abstract:
- language: en
  script: Latn
  content: |-
    The use of a Perforated Solar Screen (PSS), as a second layer of Double Skin Façades, is an effective strategy for controlling excessive sunlight, particularly in fully-glazed buildings, while also enhancing the aesthetic appeal of the facades. PSS systems are also a key factor for optimizing daylight conditions that affect occupants’ visual comfort. However, there is a notable lack of studies focusing on the daylight performance of PSS facades in offices. For this reason, this study investigates the impact of daylighting on visual comfort conditions in offices with the use of PSS facades. This research evaluates the effects of various PSS design alternatives on visual comfort conditions in terms of daylight provision, glare, and view out as described in the EN 17037 standard. The results demonstrate the daylight performance of PSS systems regarding design alternatives that involve different PSS materials and positions in offices.
