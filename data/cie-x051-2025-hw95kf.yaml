abstract:
- language: en
  script: Latn
  content: |-
    Recently, different types of places other than the office have been used for office work. The aims and values for office workers to gather in office spaces are being reconsidered. There is needed for offices to have spaces that can be used for multiple purposes as needed, rather than spaces that are specialised for a specific purpose only. The lighting design of office spaces should not only ensure visual workability, but also enhance the productivity of both the individual worker and the organization.In this study, a subjective experiment was conducted to identify the potential of luminous colour to create workspaces where different types of tasks coexist simultaneously or over time. The effects of luminous colour which gently divides the space into zones with different types of tasks are being performed on the subjects’ workability, visual fatigue, and visual comfort are examined.
