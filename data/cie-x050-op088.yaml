abstract:
- language: en
  script: Latn
  content: |-
    The objective of this presentation is to promote awareness of some of the difficulties found when measuring subjective evaluation of discomfort from glare, thus to encourage support for and participation in work to report on best practise when measuring discomfort from glare. Improving experimental design is a step towards resolving the disagreement between studies and between models of discomfort from glare.
