abstract:
- language: en
  script: Latn
  content: |-
    In recent years, grazing lighting systems have anticipated great potential for lighting motorways, but there are great difficulties in the correct sizing of the lighting installation and in quantifying the pros and cons in the obtainable visibility conditions.With the sponsorship of the Italian Ministry of Infrastructures and Transport (MIT) and the scientific partnership of the University of Naples Federico II, Movyon is carrying out a dedicated analysis to draw up design and maintenance guidelines for grazing lighting systems applications especially in highways.In this regard, in this work, the preliminary experimental results obtained in relation to the presence of fog are presented. The investigation is carried out by designing and implementing a dedicated setup able to reproduce visibility conditions in a foggy environment. Several luminous intensity distributions and positions of the grazing lighting systems sources are compared considering the deterioration of the contrast of reference objects on the carriageway as the fog density increases.
