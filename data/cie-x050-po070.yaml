abstract:
- language: en
  script: Latn
  content: |-
    Excessive night sky brightness has attracted the attention of ecology, astronomy, biology and other disciplines. In this paper, fieldwork and satellite image data were used to determine the night sky light pollution morphology of typical prairie cities. Then planar, lateral, and profile status feature data of night sky light pollution patterns are measured. According to the investigation, the three key elements influencing the morphology of night sky light pollution are the prairie town's internal organization, plan morphology, and overall lighting intensity. Then, the correlation between the specific indicators of the influencing factors and the night sky light pollution morphology is analyzed. This research method is used to quantitatively explain the external morphology of light pollution in the night sky. The findings of this study can serve as a foundation for evaluating, managing, and projecting the development of night sky light pollution in prairie towns.
