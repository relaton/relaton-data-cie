- language: en
  script: Latn
  content: |-
    On Saturday 3 April 1993, a symposium was held under the title of “Urban sky glow, a worry for astronomy.” The organizer of the symposium was the Technical Committee TC 4.21 on “Interference by Light of Astronomical Observations.” This TC works under Division 4 (Lighting and signalling for transport) of the Commission Internationale de l'Eclairage CIE. The symposium was held at the Royal Observatory, Blackford Hill, Edinburgh, Scotland, in conjunction with a meeting of CIE Division 5 and with the LuxEuropa Conference. The programme included five presentations by international experts on astronomy, lighting architecture, lighting engineering and instrumentation.The text of the presentations is given in these proceedings. Two communications that are strictly not a part of the symposium are included: an earlier presentation by Schreuder in order to set the stage, and a communication of Castro that was presented to the TC meeting that preceded the symposium.
