abstract:
- language: en
  script: Latn
  content: |-
    Due to the wide range of applications of LEDs, people are exposed to various forms of temporal light artefacts (TLAs) in many everyday situations. It is important to define and evaluate TLAs in order to raise public awareness of this issue one approach is by using imaging. In this work, established metrics for TLM and TLA are discussed regarding systematic errors and uncertainty contributions related to the sampling duration with respect to the periodicity of the waveform are to be shown and estimated.
