abstract:
- language: en
  script: Latn
  content: |-
    Augmented reality (AR) technology has been adopted in a wide spectrum of applications ranging from education, to healthcare, to manufacturing. In optical see-through AR devices, the see-through scene illuminated by ambient lighting can have a visible difference in colour and brightness from the virtual image from the AR device. This difference affects the immersion and realism experience. For example, if the ambient lighting is in a warm tone (lower CCT), it may make the higher CCT colors of the AR image appear more muted or washed out. Conversely, if the ambient lighting is cool, warm colors in the AR image may appear more vibrant or saturated. This paper addresses the effects on optical see-through AR image quality under various ambient lighting conditions.
