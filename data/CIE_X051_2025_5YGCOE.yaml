abstract:
- language: en
  script: Latn
  content: |-
    Technologies of electrochromic glazing have been developed as solutions for issues concerning luminous comfort caused by glazed facades, predominant type in non-residential buildings. The aim of this research is to examine electrochromic glazing for daylighting conditions, including non-visual effects, in a representative non-residential room within Brazilian latitudes. Computer simulations were carried out in ALFA combining 34,560 cases. The variables were: six cities/latitudes (from 3° to 29° south), four window orientations and four glazing materials, including electrochromic glazing, clear, green, and reflective silver glass. Based on the detected cases with a lack of circadian lighting and the distortions detected in the spectral analyses in the darker tint states, recommendations were made to improve the performance of electrochromic glazing regarding the minimum supply of non-visual effects of light in Brazil, by increasing from dark tint state to medium tint state according to the city/latitude, window orientation and time of the year (season).
                  See more
