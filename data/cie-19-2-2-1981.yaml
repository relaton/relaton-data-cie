abstract:
- language: en
  script: Latn
  content: |-
    The present report summarizes a comprehensive analytic model for describ­ing the influence of lighting parameters upon the effectiveness of the overall performance of tasks with significant visual components, derived from study and analysis of the extensive published literature relating visual performance to various lighting parameters which included the use of two basic technical approaches. These may be described as the "empirical" and the "analytical" methods of studying overall performance as a function of lighting parameters. Empirical studies involve measurements of the speed and accuracy of perform­ance conducted under real or simulated conditions of visual work. Analytical studies involve measurements of the operational characteristics of processes believed to be operative in visual work taken either singly or in relatively simple combinations, with subsequent synthesizing of the operational charac­teristics of the individual processes into a quantitative model intended to describe overall performance as a function of lighting parameters under condi­tions of visual work. The analytic model described in this report was derived from data obtained in these two classes of experiments during the last 50 years. In all, more than 2,200 members of the populations of CIE Member Countries were involved in these studies either as experimental observers or as unknowing participants in field observations.
