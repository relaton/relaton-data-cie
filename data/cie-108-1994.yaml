abstract:
- language: en
  script: Latn
  content: |-
    The CIE designated the year 1991 "International Daylighting Measurement Year", as the first year of the "International Daylighting Measurement Programme", referred to as the IDMP. The objective of this programme is for participants worldwide to measure daylight availability parameters under a common set of guidelines. There are two categories of IDMP measuring stations: the General Class, in which illuminances and irradiances are the principal quantities measured; and the Research Class, in which the stations also record sky luminance distributions as well as other meteorological quantities. This guide describes the measurement and instrumentation requirements of both classes of stations, provides guidelines and recommendations on data quality control, archiving and dissemination.The guide was prepared as part of the activities of CIE TC 3-07. This guide is dedicated to the late Prof. Jürgen Krochmann, a pioneer and leader in daylighting research.The publication contains 54 pages, with 6 figures and 18 tables.
