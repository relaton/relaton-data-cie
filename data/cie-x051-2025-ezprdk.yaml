abstract:
- language: en
  script: Latn
  content: |-
    Fabric products are the must-buy commodities that humans are exposed to. Current fabric image databases were developed mainly for pattern recognition and classification. Despite the large number of fabric images available in other databases, the inaccessible of the real fabrics make them less suitable for studying the differences in tactile perception between images and real fabrics. Our Leeds Fabric Tactile Database includes two parts: (1) 15 real fabrics. Images were captured when fabrics in flat and draped conditions, and then rendered by 16 evenly distributed colours. (2) 118 real fabrics. Images were captured in flat conditions, and videos were captured in rotating conditions where three frames were extracted to represent the draped condition. The visual appearance of fabrics was well captured using a digital image system and reproduced in the database. We demonstrated one of the applications of this database: predicting visual tactile perception through extracting image features.
