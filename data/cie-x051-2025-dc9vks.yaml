abstract:
- language: en
  script: Latn
  content: |-
    In this study, the lighting environment at home used for telecommuting in Japan was assessed from the viewpoint meet the recommended melanopic equivalent daylight illuminance (melanopic EDI). The horizontal and the vertical illuminance levels in the spaces used for telecommuting, such as living-dining room and study room were analysed. The results show that spaces with daylight from windows are likely to retain the melanopic EDI higher than 250 lx during the daytime. However, the melanopic EDI during the nighttime mostly exceeds 10 lx. The findings emphasize the importance to consider the local lifestyle and various ethical visual characteristics when integrating non-visual light effects into the design of lighting.
                  See more
