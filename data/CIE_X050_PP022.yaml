abstract:
- language: en
  script: Latn
  content: |-
    The reflection of roads concerning vehicle lighting was examined on a wide range of road surfaces (hot rolled asphalt, mastic asphalt, porous asphalt, concrete and coating, made of epoxy resin and small-grain aggregate mixtures; in total 57) for 26 different combinations of headlamp height, observation height and distance under laboratory conditions.A significant but complex relation exists between reflection and all three geometry variables. The link between reflection and angular expressions of the geometric situation is much weaker. Additionally, RL is a good candidate as a characteristic value to characterise the lightness of roads concerning vehicle headlamp lighting.Further, road reflection concerning road lighting was also examined on those surfaces (characteristic values Q0 and S1, characterising lightness and specularity, respectively). RL varies closely non-linearly with S1, the characteristic value of specularity in terms of road lighting, and not very much with Q0.
