abstract:
- language: en
  script: Latn
  content: |-
    Lighting conditions in a parking garage are mainly designed for motorized traffic. However, vulnerable road users are often present, and their perception of safety is currently not considered. While luminaires are often replaced by energy-efficient LEDs, this opens possibilities for adjusting illuminance levels and correlated colour temperatures (CCT). For this reason, this study presents a pairwise experiment held in an underground parking garage to identify combinations of vertical illuminance (Ev,v) and CCT with the highest perception of safety.Preliminary results show that a CCT equal to 3000K and 4000K are preferred over 5000K, with a higher significance at higher Ev,v. This suggests that CCT is less relevant at lower Ev,v. The results also indicate a possible stimulus range bias for Ev,v, and therefore a follow-up study with a different stimulus range is required. Through the observations presented in this study, improved suggestions for parking garages standards can be prepared.
