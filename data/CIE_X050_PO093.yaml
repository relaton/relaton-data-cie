abstract:
- language: en
  script: Latn
  content: |-
    In recent years, a shift towards working from home has taken place. For conventional offices in Europe, the lighting is designed complying to standards such as the EN 12464-1 and the EN 17037, and recommendations regarding non-image forming effects are available. However, for the home office, the aforementioned standards do not yet exist, although some guidelines are available. Hence, it is unknown whether the (day)lighting conditions in home office spaces suffice for office tasks. This study aimed to make a first inventory of daylighting conditions in Dutch home offices by conducting an online questionnaire study. The results of the study showed that many differences exist between home office configurations, and that the needs of each individual home worker with regards to daylighting differ. This stresses the need to develop personal recommendations for daylight in the home office.
