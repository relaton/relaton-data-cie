abstract:
- language: en
  script: Latn
  content: |-
    This ISO/CIE International Standard specifies the method of calculating the coordinates of the CIE 1976 L*u*v* colour space including correlates of lightness, chroma, saturation and hue. It includes two methods for calculating Euclidean distances in this space to represent the relative perceived magnitude of colour differences. It also specifies the method of calculating the coordinates of the u′,v′ uniform chromaticity scale diagram.This ISO/CIE International Standard is applicable to tristimulus values calculated using the colour-matching functions of the CIE 1931 standard colorimetric system or the CIE 1964 standard colorimetric system. This document is applicable for the specification of colour stimuli perceived as belonging to a reflecting or transmitting object, where a three-dimensional space more uniform than tristimulus space is required. This includes self-luminous displays, like computer, television and smartphone displays, if they are being used to simulate reflecting or transmitting objects and if the stimuli are appropriately normalized.This ISO/CIE International Standard, as a whole, does not apply to colour stimuli perceived as belonging to an area that appears to be emitting light as a primary light source or that appears to be specularly reflecting such light. Only the u′,v′ uniform chromaticity scale diagram defined in 4.1 and the correlates of hue and saturation defined in 4.3 apply to such colour stimuli.
