  content: |-
    This document was prepared by the International Commission on Illumination (CIE) in cooperation with Technical Committee ISO/TC 274, Light and lighting.

    This first edition of ISO/CIE 17166 cancels and replaces ISO 17166:1999 | CIE S 007-1998, of which it constitutes a minor revision. The document has been editorially revised as per current ISO and CIE rules and the references have been updated.

    The document specifies the erythema reference action spectrum, ser(), and the standard erythema dose (SED).

    The problem of dosimetry in skin photobiology lies in the fact that the ability of ultraviolet (UV) radiation to elicit erythema in human skin depends strongly on wavelength, encompassing a range of four orders of magnitude between 250 nm and 400 nm. Thus, a statement that a subject received an exposure dose of 1 J?cm?2 (104 J?m?2) of UV radiation conveys nothing about the consequences of that exposure in terms of erythema. If the radiation source was a UV-A fluorescent lamp, no erythemal response would be seen apart from in people exhibiting severe, abnormal pathological photosensitivity. The same dose delivered from an unfiltered mercury arc lamp or fluorescent sun-lamp would result in marked violaceous erythema in most white-skinned individuals. Consequently, photobiologists have long recognized the need to express the exposure as an erythemally weighted quantity.

    The term "minimal erythema dose (MED)" has been used widely as a measure of erythemal radiation. This is unreasonable because the MED is not a standard measure of anything but, on the contrary, encompasses the variable nature of individual sensitivity to UV radiation. Variables that affect the MED include: optical and radiometric characteristics of the source; determinants of the exposure, such as dose increment and field size; nature of the skin, such as pigmentation, previous light exposure and anatomical site; and observational factors, such as definition of the endpoint, time of reading after exposure and ambient illumination.

    To avoid further confusing misuse of the term MED, it is proposed that this term be reserved solely for observational studies in humans and other animals, and that the term "standard erythema dose (SED)" be used as a standardized measure of erythemogenic UV radiation.
