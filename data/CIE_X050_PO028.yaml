abstract:
- language: en
  script: Latn
  content: |-
    In order to create effective human centric lighting, it is essential to understand the various diseases and pathological conditions that can affect vision and alter lighting requirements. This screening study seeks to uncover the incidence of such diseases in order for us to be better informed when designing appropriate light levels for optimal visual comfort. As many of these conditions are progressive, we must also consider how changing modalities may need to be implemented over time as individuals' vision changes or decreases due to their condition. By taking into account all possible needs related with health-related light perception within our society, we can take human centric lighting design even further towards its full potential.
