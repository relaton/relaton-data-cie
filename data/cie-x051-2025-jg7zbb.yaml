abstract:
- language: en
  script: Latn
  content: |-
    The reflection properties of road surfaces depend on both the type of pavement and its age, but this dependence is not well known. This paper proposes a deterministic nonlinear model to predict the evolution of reflection properties of road surfaces up to 36 months, focusing on the macroscopic CIE descriptors Q0 and S1. Based on French experimental data, the model takes the age, the aggregate size and the colour of the road surface into account. Internal and external validations show that the model quite satisfactorily captures the overall trends in the evolution of Q0 and S1. These results provide a solid basis for improving the prediction of reflection properties of road surfaces, guiding future applications.
                  See more
