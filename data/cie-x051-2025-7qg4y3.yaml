abstract:
- language: en
  script: Latn
  content: |-
    The need for revision of CIE115:2010 is widely acknowledged and is currently a focus of activity in CIE Division 4. The first stage of this task is intended to be a rapid revision based on what we already know rather than waiting for new research to be completed. This article concerns lighting for pedestrians, the key road user for P class roads in CIE115. CIE 236:2019 indicates that pedestrian reassurance is a suitable focus for establishing optimal lighting conditions for the P class, and hence this article aims to support rapid revision of the P class through analysis of the results from previous field studies of pedestrian reassurance, these included for their use of the day-dark method proposed by Boyce et al. This analysis suggests an optimal average illuminance of around 7,5 lx: higher illuminance brings negligible increase in reassurance.
