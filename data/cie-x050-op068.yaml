abstract:
- language: en
  script: Latn
  content: |-
    Depending on the climatic region, the road surface may be wet or moist for a large part of the year, reducing lighting performance. With the current technological developments introduced by LED luminaires, it now seems possible to adapt lighting to the surface condition of pavements, to meet energy and safety requirements. However, photometric characterisation of wet pavements is very difficult because their surface condition changes rapidly, whereas r-table measurements conducted in the laboratory are generally time-consuming. We propose a simple and pragmatic wetting protocol which, associated with the COLUROUTE rapid portable device, allows pavements characterisation for different wetting conditions both in the laboratory and on site. The results obtained showed that the use of standard CIE W wetting tables is not relevant for all pavement types and different wetting states. In addition, we found a correlation between Q0 and S1 for the different wetting conditions.
