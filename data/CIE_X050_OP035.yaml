abstract:
- language: en
  script: Latn
  content: |-
    CIE cone-fundamental-based photometry has drawn close attention as a concept to derive scientifically more reliable data to quantify visual sensation. Recently, argument has been stirred up about the possibility to adopt a revised spectral luminous efficiency function VF(λ) based on the CIE cone-fundamentals as a standard function to derive photometry quantities, instead of current V(λ) function. While adopting a scientifically more rigorous concept in the SI is quite important, there seems controversy on the idea to replace from V(λ) to VF(λ). Two ways of analysis, in terms of the potential change of photometric values and an instrument quality index, were made to identify the real impact when the standard photometric function V(λ) is replaced with VF(λ). It was found that the potential changes caused by the replacement of the standard photometric function are not negligible in many cases, and explicit discontinuity of the measurement values, that cannot be compensated by modifying the definition of the base SI unit, would be occurred.
                  See more
