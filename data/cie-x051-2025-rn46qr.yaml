abstract:
- language: en
  script: Latn
  content: |-
    Since the discovery of the intrinsically photosensitive retinal ganglion cells (ipRGCs), their roles have been investigated by vision researchers around the world, and their effects on non-image-forming functions, such as circadian rhythm and pupillary light reflex, are now being evaluated. Furthermore, it has been suggested that the ipRGCs are also involved in contrast sensitivity, a fundamental function of the human visual system. Therefore, the purpose of this study is to clarify whether the high luminance ipRGC stimulation affect contrast sensitivity in central vision. In this study, a silent substitution method was applied using a multichannel variable wavelength light source to create background stimulus that stimulates only ipRGCs. The test stimulus was a Gabor stimulus presented on the display. The results showed that the higher the amount of stimulus given to the ipRGCs, the lower the contrast sensitivity, and the lower the amount of stimulus, the higher the contrast sensitivity.
