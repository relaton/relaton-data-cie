abstract:
- language: en
  script: Latn
  content: |-
    This study used three visual assessment techniques, partition scaling, unique hue judgement and colour matching, to develop a characterisation model for a head-mounted display (HMD) – taking the GOG model as an example in this research. A pilot study was first carried out on an LCD for feasibility test, with 33 observers taking part. This was followed by the main experiment, using the same visual assessment sessions for an HMD, with 24 observers participating. Lastly, a colour appearance experiment was conducted to evaluate the visually-based GOG model for the HMD. The experimental results show good predictive performance, with a CV value of 22.7 for lightness, 33.9 for colourfulness and 5.5 for hue quadrature between the visual results and the predicted values by the visually-based GOG model.
