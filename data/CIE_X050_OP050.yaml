abstract:
- language: en
  script: Latn
  content: |-
    In recent years, the scale of windowless spaces in cities has been growing rapidly, and how to provide appropriate lighting and view in windowless spaces has been a topic of interest for scholars. In this study, we used the mixed reality function in a new Virtual Reality device to construct artificial view windows, and explored the participants' free preferences for the position, size, and scale of the artificial view in a daily-scale square windowless office space. Through the measurement of electrodermal activity data and the analysis of subjective emotion evaluation scale, we obtained that the artificial view window has a positive psychological effect on the participants in the windowless space, and comprehensively came to the preliminary conclusion that the preferred form of artificial view with the best psychological gain can be applied to the design of the lighting in the windowless space.
