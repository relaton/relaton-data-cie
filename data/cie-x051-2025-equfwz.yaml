abstract:
- language: en
  script: Latn
  content: |-
    Evaluation of lighting quality of urban space at night can be collected in asking pedestrians at a specific place of the space while looking at it, or after walking, which is a more ecological behaviour. This study addresses this methodological issue in comparing static evaluations (free gaze in one direction; fixed position) and evaluations after a walk in the street (free gaze; ecological task) in three urban pedestrian pathways. Subjective assessments about the perceived luminous environment, discomfort from glare, perceived safety and the overall satisfaction were collected after a 15-m walk on a pedestrian path (dynamic) or standing at a static position at mid-distance of this 15-m path. Forty-three participants were involved in the experience. No difference was found between evaluations in static position or after walking, except for the perceived visibility and the item “I feel uncomfortable with the idea to walk into this street”.
