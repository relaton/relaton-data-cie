abstract:
- language: en
  script: Latn
  content: |-
    This International Standard defines spectral sensitivity functions , quantities and metrics to describe the ability of optical radiation to stimulate each of the five photoreceptor types that can contribute, via the melanopsin-containing intrinsically-photosensitive retinal ganglion cells (ipRGCs), to retina-mediated non-visual effects of light in humans. This International Standard is applicable to visible optical radiation in the wavelength range from 380 nm to 780 nm. In addition, this standard includes information concerning the effects of age and field of view (FOV) when quantifying retinal photoreceptor stimulation for ipRGC-influenced responses to light (IIL responses).This International Standard does not give complete information for particular lighting applications, or for the quantitative prediction of IIL responses.This International Standard is not intended for colorimetric contexts, nor does it address health or safety issues such as those resulting from light treatment, flicker or photobiological safety and only relates to retinal photoreception.
