abstract:
- language: en
  script: Latn
  content: |-
    The integrating sphere has been used to measure the total flux of various types of light sources, but the measurement error caused by the optical design was not negligible. In this study, the measurement error with respect to the lamp beam angle was investigated based on a 2π geometric integrating sphere photometer model with the spatial response distribution function (SRDF) in the sphere was calculated by optical simulation. This study investigates two distinct types of sphere model (A and B), and the SRDF exhibited unique behaviours depending on each model. Moreover, the evaluation of each sphere utilising a variety of light distribution sources indicated that sphere type should be employed depending on purpose. Type A demonstrated the capacity to measure overall beam angle with decent accuracy. In contrast, Type B showed to achieve near-perfect accuracy for angle exceeding 50°, but their performance deteriorates significantly for angle narrower than this angle.
