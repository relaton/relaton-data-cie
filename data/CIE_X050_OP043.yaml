abstract:
- language: en
  script: Latn
  content: |-
    Prolonged self-study situations in which multiple people share the same space are common. In this study, a natural experiment of prolonged self-study was conducted in a real self-study room, and 12 typical seating locations were selected as the experimental locations to obtain the luminous environment and multidimensional performance data of each location throughout the day (3.5 hours in the morning and 3.5 hours in the afternoon). Through inter-location differences test and cluster analysis, the multidimensional attributes of the locations were portrayed, and the effects of the luminous environment and the psychological attributes of the seating locations on learning performance were analysed. The study showed that learning performance in prolonged self-study situations was affected by the combined effects of luminous environment and psychological attributes of seating location. Psychological attributes of location had a greater effect when the minimum illumination requirement (300 lx) for the visual task was met.
