abstract:
- language: en
  script: Latn
  content: |-
    This paper presents a new analytic visibility model of the phantom array effect. The threshold frequency of the visibility of the phantom array effect can be affected by luminance, chromaticity, modulation depth, geometric characteristics of the light source, and saccadic eye movement speed. We model the perception of the phantom array as a detection of spatially spread modulation interval by saccadic eye movement from temporal modulation of the light sources. The spatial integration model is used to determine the interval to be perceived in addition to the spatial contrast sensitivity. Eye movement speed is also considered and interpreted by the spread of the temporally modulated signals. Temporal integration also provides a limit to the modulation as well. The proposed model will be helpful for the prediction of the visibility of the phantom array for given conditions. In addition, the model is useful for the metric development of the phantom array effect.
                  See more
