abstract:
- language: en
  script: Latn
  content: |-
    The purpose of this study is to characterise the predictive performance of the CIECAM02 and CIECAM16 colour appearance models by comparing with experimental results on Hunt Effect over a wide range of illuminance levels. In our earlier experiments, red, green, yellow, blue colour matching data under higher illumination levels (6000 lx, 1000 lx, 100 lx) were collected. In this study, another experiment was conducted to collect colour matching data on Hunt Effect at lower illumination levels (300 lx, 100 lx, and 30 lx). The chromaticity coordinates of the matches and targets from both experiments were first calculated and plotted in CAM02UCS colour space. Then the CIECAM02 and CIECAM16 predictions of the colourfulness and hue angles for matches and targets were compared across different illumination levels (30 lx to 6000 lx). Slight differences (<10 %) in colourfulness of predicted matches and targets were found for lower illumination levels, while substantial differences (15 % to 30 %) were found for higher illumination levels. The findings are important not only for colour appearance prediction, but also for colour-related applications, such as deriving better colour fidelity models based on the Hunt effect.
