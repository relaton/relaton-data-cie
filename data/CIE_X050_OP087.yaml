abstract:
- language: en
  script: Latn
  content: |-
    Due to various factors including heavy academic workload, social competition, and interpersonal relationships, a growing number of college students are experiencing mental health issues. This study aims to explore the impact of campus lighting environments on college students’ restorative experiences. We assessed physiological, psychological, and behavioural changes in college student participants to evaluate the restorative benefits of the same space under three different lighting conditions: a cloudy daytime scene, night scene A with landscape and street light, and night scene B with only street light. The results from Inter-Beat Interval, reaction speed, and the Perceived Restorative Scale (PRS) indicate that night scene A is evaluated more positively in terms of its restorative benefits compared to the daytime scene. These findings provide practical evidence for the potential restorative effects of nighttime landscapes.
