abstract:
- language: en
  script: Latn
  content: |-
    Array spectroradiometers are increasingly being used to determine basic photometric quantities such as illuminance or CIE xy. Proper interpretation of these results requires the determination of uncertainties. Examples of the random component of uncertainty could be a power disturbances or changes in the radiation source. Due to the nature of spectral measurements, the method for estimating the uncertainty of these results recommended by GUM Supplement 2 is the Monte Carlo method. For measurement series characterized by large scatter or asymmetry of distribution, resampling with the Bootstrap method can improve the uncertainty estimation by refining the probability distribution of random errors.The paper presents the results of a comparison of a Monte Carlo uncertainty assessment for illuminance and CIE xy, obtained from series of spectral measurements deviating from the normal distribution, using two random error modelling methods: based on the standard deviation of the measurement series and those using the Bootstrap method.
