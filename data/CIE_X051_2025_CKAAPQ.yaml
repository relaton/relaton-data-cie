abstract:
- language: en
  script: Latn
  content: |-
    Traditional urban lighting design emphasizes visibility and safety but often overlooks emotional and social responses. This study proposes an integrated triadic framework combining the PAD emotional modelling, Visual Light Field (VLF) theory, and cubic illuminance metrics to evaluate the affective impacts of spatial lighting. A pre-social survey and two controlled simulation experiments were conducted to examine perceptual and emotional effects under varied lighting configurations. Results show that greater horizontal illuminance asymmetry significantly elevates Arousal while reducing Pleasure and Dominance, while the richness of higher-order lighting components significantly enhances Pleasure and Dominance. These findings support experience-driven lighting strategies and provide actionable metrics for designing emotionally responsive public spaces.
