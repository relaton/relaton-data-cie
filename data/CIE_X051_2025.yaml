  content: |-
    The CIE holds its scientific conferences every two years as part of its Midterm Meetings or Quadrennial Sessions, providing a regular forum for sharing new research in light and lighting and related fields. This volume of the Proceedings of the CIE (International Commission on Illumination), CIE x051:2025, brings together the scientific contributions presented at the CIE 2025 Scientific Conference (7-9 July, 2025) which was held as part of the CIE 2025 Midterm Meeting in Vienna, Austria (4-11 July, 2025).The CIE is the peak global organisation devoted to worldwide cooperation and exchange of information on all matters related to science, technology, and the art of light and lighting, including indoor and outdoor applications and lighting design, colour and vision, measurement topics, photobiology and photochemistry, as well as image technology. Accordingly, the conference contributions relate to the full scope of the CIE’s work and related fields.All papers published in this volume (Part 3, 4, 5) underwent a rigorous double-blind peer review process and were accepted for presentation at the CIE 2025 Scientific Conference. Next to procedural and programme overviews, this proceedings volume contains of 153 Full-length Papers and 64 Short Papers, along with the abstracts of 20 further accepted papers with publication opt-outs as well as the abstracts of the 3 invited keynote lectures and 6 curated CIE workshops.
