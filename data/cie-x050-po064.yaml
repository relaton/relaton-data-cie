abstract:
- language: en
  script: Latn
  content: The individual difference in selecting seat and lighting may be caused
    by difference in their personality or mood and their experience. The purpose of
    this study is to identify the influence of their personality and individual’s
    light environment experiences on the process of selecting seat and lighting for
    the task in ABW. The light environment experiences survey, and selection of seating
    and lighting were conducted. There were two type of task, two types of seat and
    six types of lighting. Most respondents used white light and uniform illuminance
    distribution for task. There was no difference in illuminance distribution between
    each task for the light environment experience, but more respondents preferred
    a brighter illuminance distribution from the centre for thinking task. There was
    little diversity in light environment experiences, so that no clear relationship
    was obtained between light environment experiences and lighting preferences.
