abstract:
- language: en
  script: Latn
  content: |-
    This paper introduces SKYSPECTRA, an open-source data package comprising spectral daylight measurements collected from various sources worldwide. The dataset encompasses measurements from both long-term measurement sites and specific periods or experiments. The paper describes the data collection, selection, and organisation process within a standardised framework, ensuring consistency in naming conventions, formats, and units across all datasets. It also describes how the data is structured for operability in programming languages like R or Python for data analysis. SKYSPECTRA aims to facilitate further research and development of daylight applications that leverage spectral sky data by providing a comprehensive and standardised sample spectral daylight dataset that represents geographical locations, seasons, atmospheric conditions, and times of day.
                  See more
