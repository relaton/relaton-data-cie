abstract:
- language: en
  script: Latn
  content: |-
    Activity Based Working offices has gained attention, and various lighting design values for various activities are becoming more important. Target and ambient lighting (TAL), creating the diversity of illumination distribution, is expected not only to contribute to decarbonization but also to diversify spatial impressions compared to general lighting. This paper clarifies the lighting requirements diverse spatial impressions and subjective visual performance. Also, age-related differences for those were examined. The results suggest that the target/ambient illuminance ratio (TAIR) of approximately 2, coupled with a lower CCT, enhances a warm atmosphere. Conversely, a TAIR of 3 or higher, increases task immersion. No significant differences related to age were showed in terms of spatial impressions. On the other hand, subjective visual performance of over-40 group is low with narrow beam angle target lighting. Thus, lighting design values in workspaces should be adjusted based on demanding spatial impression and the age of workers.
