abstract:
- language: en
  script: Latn
  content: |-
    In Japan, lighting for single rooms with one luminaire has been common, but lighting designs incorporating multiple luminaires are getting popular marginally. While those lighting designs can shape the impression of a space flexibly, it is difficult to select the optimum lighting design from the infinite number of lighting designs. To overcome this, accumulating impressions of various lighting designs is important. However, impression evaluations with many participants and real spaces consume massive time and cost. To avoid this, we developed a deep learning-based model to estimate impressions for Virtual Reality lit spaces. The model was trained with impression evaluation data for the spaces. A model test with validation data shows accuracy of 84% to 98%. Consequently, we constructed a database of 1,000 lighting designs with images and impression scores.
