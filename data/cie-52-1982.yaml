abstract:
- language: en
  script: Latn
  content: 'Photocopy Edition 1997The method presented in this report deals with average
    illuminances at the working plane, walls and ceiling.It is a design method (determination
    of light distribution and arrangement of luminaires required for specified illuminances)
    as well as a verification method (calculation of illuminances of a design or an
    existing installation).The method is distinguished from most of the existing methods
    by its possibility to take into account the influence of the luminaire arrangement.The
    method is based on CIE 40-1978 Calculations for Interior Lighting: Basic Methods.'
