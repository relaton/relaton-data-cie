abstract:
- language: en
  script: Latn
  content: Japan is one of the most disaster-prone countries in the world, and in
    the event of a large-scale disaster such as a great earthquake, many evacuees
    are forced to live in evacuation centers for extended periods of time. However,
    gymnasiums, which are often used as evacuation centers in Japan, are not designed
    primarily for evacuation, and are not necessarily well equipped as living spaces
    during disasters. In this study, from the viewpoint of providing basic data for
    lighting design in evacuation centers, the relationship between the spatial brightness
    evaluation of evacuation center and the impression evaluation by assumed several
    activities in various lighting levels and lighting patterns was summarized.
