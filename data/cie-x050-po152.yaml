abstract:
- language: en
  script: Latn
  content: |-
    To understand how perceived light qualities in everyday life impact comfort and well-being, it is important to study diverse light environments where two or more light sources may counteract or support each other. Combinations of directed and omnidirectional light sources differing in colour temperature and placement were analysed using sensory analysis. Also, luminance was measured. In all 16 combinations of light sources, varied according to a full factorial design, were included. Each combination consisted of two light sources. In conclusion: light distribution of point lighting is the most decisive for whether the light is perceived as diffuse or distinct. Directed light sources is perceived as distinct, it is reinforced if both point and general lightings are directed. The point lightings also have a greater impact on perceived light colour than the general lighting. All design factors had a significant impact on perceived light qualities of light sources in combinations.
                  See more
