abstract:
- language: en
  script: Latn
  content: |-
    The handheld pupil detector equipment provides medical personnel with a first step assessment of the condition of the patient. It can quickly determine the size of the pupil and provide accurate quantitative values for medical personnel. Initially evaluate the patient's central nervous system or drug reaction. It will increase the convenience of frontline medical staff and nurses in the future. We simulate the light source of the detector equipment using non-sequential ray tracing with eye model. The evaluation light source has enough intensity for the human eye to stimulate and observe the national standard of Photobiological safety and increase the contrast in image processing. The results confirm that the hardware device has the desired effect of detecting the pupil of the human eyes.

