  content: |-
    In October 2021 CIE held a 3-day online conference, CIE 2021, which originally was intended to accompany the CIE 2021 Midterm Meeting. Experts from all over the world presented latest research results and survey lectures in 4 invited presentations, 68 oral presentations, 58 posters and 8 workshops.  Various subjects related to light and lighting were covered, e.g. "Integrative lighting", "Visual appearance", "Glare", "Measurement theory", "Daylight", "Temporal light modulation", "Road lighting", "Residential lighting", "Measurement of materials and sources".
