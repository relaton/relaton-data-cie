abstract:
- language: en
  script: Latn
  content: |-
    Lighting in living environment has a non-negligible impact on psychology and physiology of occupants. In the study, the real-time effects of artificial lighting color of red, yellow, blue, green and white in living room space on human spatial perception and physiological indexes related to cardiac response were investigated. The atmosphere perception was measured with semantic difference scale. And an electrocardiogram (ECG) event recorder were used to monitor the effect of light color on human heart rate and heart rate variability (HRV). The results of data analysis showed that lighting color had a significant effect on space perception indicators, such as warm/cool, casual/formal, and open/closed, and so on. However, no significant effect of light color on average heart rate and HRV related indexes was found.
