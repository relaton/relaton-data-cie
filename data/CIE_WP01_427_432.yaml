abstract:
- language: en
  script: Latn
  content: |-
    Solid-state lighting (SSL) products are already in use by consumers and are rapidly gaining the lighting market. Especially, white Light Emitting Diode (LED) sources are replacing banned incandescent lamps and other lighting technologies in most general lighting applications. The aim of this work is to develop LED-based illuminants that describe typical white LED products based on their Spectral Power Distributions (SPDs). Some of these new illuminants will be recommended in the update of the CIE publication 15 on colorimetry with the other typical illuminants, and among them, some could be used to complement the CIE standard illuminant A for calibration use in photometry.

                  See more
