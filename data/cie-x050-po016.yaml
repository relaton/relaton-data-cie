abstract:
- language: en
  script: Latn
  content: |-
    This study aimed to understand, from the perspectives of architects in different countries regarding their education in lighting and its implications for their professional practice. In addition, also observe their shortcomings in order to contribute to a discussion about teaching. Questionnaires were applied to architects from Brazil and Italy and the results revealed differences such as exposure to teaching and educational emphasis and similarities such as recognizing the extreme importance of lighting in architecture and feeling the need for more active methodologies in teaching. Terms such as "practical application," "hands-on experiences" and "field visits" were identified as crucial elements for improving understanding and skills in lighting design in both contexts. The study concludes emphasize the significance of enhancing lighting education within architecture curricula as a means to better equip future architects in shaping and enhancing the human experience within the built environment.
                  See more
