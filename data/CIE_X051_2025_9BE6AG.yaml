abstract:
- language: en
  script: Latn
  content: |-
    https://doi.org/10.25039/x051.2025/9be6agSince the number of accidents involving cyclists is significant, partly due to poor visibility, our research aimed to develop and test a new lighting concept for urban road lighting systems to improve the visibility of cyclists.The previous requirements of CIE 115 and subsequently EN 13201 aim to ensure a negative contrast with the help of certain illumination levels. The approach we subsequently investigated was to create a positive contrast in conflict situations with a low lighting level. For this purpose, the parameter vertical illuminance was selected, quantified and implemented by optimised light distributions. The effectiveness of the parameter was then validated by practical measurements in which the effect on the visibility of cyclists was assessed.On the basis of the investigations, recommendations were developed, along with a proposal for revising EN 13201, the application of which would lead to a lighting concept that enables a higher visibility of cyclist.
