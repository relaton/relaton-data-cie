abstract:
- language: en
  script: Latn
  content: Slow oscillations (SOs) have played an important role in slow wave sleep.
    Slow oscillations refer to the continuous oscillation of the cortex and thalamus
    neurons in synchronous network patterns, manifested as slow fluctuating activities.
    Modulating slow oscillations through non-invasive brain stimulation during sleep
    is a potential treatment for sleep disorders. This study used dynamic light (<1Hz)
    as an external stimulus to enhance slow oscillations and observe their relationship
    with memory consolidation. The results showed that dynamic light can enhance NREM
    sleep but had no significant effect on memory consolidation.
