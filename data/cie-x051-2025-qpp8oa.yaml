abstract:
- language: en
  script: Latn
  content: |-
    Work investigates the impact of different correlated colour temperature (CCT) calculation methods on the accuracy of the Colour Rendering Index (CRI) measurement. As the choice of CCT calculation method influences the reference illuminant used in CRI computation, discrepancies in CRI values may arise. Nine CCT calculation methods were analyzed using 18 spectral power distributions (SPDs) selected from the EMPIR 15SIB07 PhotoLED database. The results indicate that, despite variations in CCT values, the CRI index is largely unaffected by the choice of calculation method, with minimal discrepancies observed across the methods. The findings suggest that, for most practical applications, the CCT calculation method has negligible impact on CRI accuracy, and other factors, such as performance, should guide the selection of the optimal CCT calculation approach.
