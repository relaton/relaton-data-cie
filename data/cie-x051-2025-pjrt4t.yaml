abstract:
- language: en
  script: Latn
  content: |-
    For road lighting design, reflection properties of dry surfaces are considered. Yet, wet roads impair lighting performance, emphasizing the critical need of measured data for wet road surfaces. However, these measurements are challenging, as one has to characterize different wetting states, and ensure that time-consuming measurements are done in a given state, notwithstanding the evaporation and drain process. We propose to address these challenges. Different wetting states, from “dry” to “flooded”, have been characterized qualitatively and linked to an objective feature, the specularity of the surface. Then, a protocol is proposed, to regulate the wetness of a road sample in order to keep it in a given wetting state throughout its measurement. In this regard, a device was designed and included on a gonioreflectometer to pour water on the sample when needed. Examples of measurements of three samples in several wetting states are presented, highlighting significant photometric differences across wetting states.
