abstract:
- language: en
  script: Latn
  content: |-
    In large-area power outages it is difficult to achieve power supply for emergency lighting timely. The independence and redundancy of backup power systems can lead to waste due to extremely low utilization. In the era of mobile electronic devices and the sharing economy, per capita handheld lighting terminals and widely distributed power storage networks provide new possibilities for emergency evacuation lighting in buildings. This article simulates the evacuation scenario under sudden power outage, adopts the strategy of handheld mobile device lighting and temporary rental of sharing power bank, calculates the ratio of the number of power banks that need to be charged under different evacuation durations. The results show that under the shared power bank network in the core area of the city, mobile device lighting can meet the evacuation lighting duration at a certain stage and is helpful for emergency evacuation in the early stages of incident.
                  See more
