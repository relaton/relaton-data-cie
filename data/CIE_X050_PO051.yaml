abstract:
- language: en
  script: Latn
  content: |-
    In the world of Smart Cities and Internet of Things (IoT), traditional pre-programmed street lighting dimming systems are obsolete. Capable of measuring three essential parameters for outdoor street lighting control (traffic volume, weather conditions and average road surface luminance), a new generation of sensors is providing, at reasonable costs, opportunities for new approaches in design, maintenance and operation of road lighting installations. Therefore, new possibilities for Adaptive Road Lighting (ARL) are possible. A project in Agrate Brianza (Italy) allowed to test new approaches in order to extend the application of ARL to all the municipality area.
