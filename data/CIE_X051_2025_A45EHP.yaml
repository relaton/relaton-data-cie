abstract:
- language: en
  script: Latn
  content: |-
    Emotional responses to vegetation-based nighttime lighting remain poorly understood beyond basic colour–emotion associations. This study develops a spatialized PAD framework integrating hue composition, foliage chromaticity, and center–periphery colour placement. A pre-survey and laboratory experiment examined 32 lighting projection scenarios across green and yellow foliage substrates. Regression and affective typology analyses revealed that yellow and white lighting, especially when centrally projected onto yellow foliage, consistently enhanced Pleasure, Arousal, and Dominance. In contrast, cool-toned projections (blue, purple) suppressed affective scores, particularly under green foliage. Spatial asymmetry moderated these effects, with center–dominant warm hues amplifying engagement and peripheral cold tones dampening it. The findings establish a multidimensional model of affective lighting perception and offer design-level strategies for emotionally attuned nightscape environments.
