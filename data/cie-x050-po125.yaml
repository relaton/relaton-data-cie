abstract:
- language: en
  script: Latn
  content: |-
    It has been pointed out that, even though the amount of sunlight is secured by the Building Standards Law in Japan, sufficient sunlight is not ensured. There are many voices pointing out the sunlight blockage even in unregulated districts, and sunlight problem is often pointed out from composite perspectives. However, the impact of sunlight blockage has not been clarified. We conducted experiments to analyse the changes in residential environment caused by sunlight blockage from an apartment building on the land to the south and its effects on residents from the subject apartment building in terms of psychological, physiological, and physical quantities. It was clarified that blockage of sunlight caused by a proximate building led the significant decrease in illuminance, and the impression evaluation showed that the impressions of the residential environment decreased, confirming that the change in the residential environment had a significant impact on the residents' psychological aspects.
