abstract:
- language: en
  script: Latn
  content: |-
    This study is a part of an evaluation of the impact of light quality on the perceived complexity of a scene for live entertainment. In this subpart of the study, we are wondering about the choice of the spectral difference calculation approach. The proposed experiment is first based on the comparison of an LED spotlight and its light when several filters are applied to it. Subsequently, a halogen light is compared against the same LED light under the same filters. A metrologically valid spectral difference metric (KLPD) is compared with an empirical construction based on L2 metrics and Spectral Angle Mapper differences. To establish a relationship between the physical stimuli (light spectra) to one aspect of its perceptual impact, the spectral differences were correlated with the Duv. The results show a good correlation between the KLPD and the Duv calculated using the TM30-20’s method for Duv calculation (Ohno, 2013).
